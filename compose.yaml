services:
  sablier-mini-kv:
    image: ghcr.io/ivsop/sablier_mini_kv:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LISTEN_ADDR: 0.0.0.0:3000
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${HTTP_PORT:-3000}:3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
